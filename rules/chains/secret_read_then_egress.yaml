id: chain.secret_read_then_egress
version: "1.6"
enabled: true
title: Secret-file access followed by data-bearing egress
description: |-
  Within one session, the agent attempted to read a known secret-bearing file or process
  environment block and later proposed a data-bearing outbound command or MCP call.
  The chain covers structured tool reads and explicit shell/PowerShell content reads;
  it does not establish that content from the read was used by the later action.
severity: high
