id: recon.privilege_escalation
version: "1.3"
enabled: true
title: Privilege-escalation path enumeration requested
description: |-
  The agent requested its sudo grants or a recursive search of system roots for setuid,
  setgid, or file-capability escalation paths. Project-local permission checks are not
  included.
severity: medium
expr: |-
  (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
  shell_commands.exists(command,
    (
      command.name.matches("(?i)^sudo$") &&
      !command.argv.exists(arg,
        arg == "-V" ||
        arg.matches("(?i)^--(help|version)$")
      ) &&
      lists.range(command.argv.size()).exists(i,
        i > 0 &&
        command.argv[i].matches("(?i)^(-l|-ll|--list)$") &&
        lists.range(i).all(j,
          j == 0 ||
          command.argv[j].startsWith("-") ||
          (
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-C|-D|-g|-h|-p|-R|-r|-t|-T|-U|-u|--close-from|--chdir|--group|--host|--prompt|--chroot|--role|--type|--other-user|--user)$")
          )
        )
      )
    ) ||
    (
      command.name.matches("(?i)^find$") &&
      lists.range(command.argv.size() - 1).exists(i,
        i > 1 &&
        command.argv[i].matches("(?i)^-perm$") &&
        command.argv[i + 1].matches("(?i)^[/-]?([246]000|[ugo]*[+=]s)$") &&
        command.argv.slice(1, i).exists(arg, arg in ["/", "/usr", "/bin", "/sbin", "/opt"])
      )
    ) ||
    (
      command.name.matches("(?i)^getcap$") &&
      command.argv.exists(arg, arg.matches("(?i)^(-r|--recursive)$")) &&
      command.argv.slice(1, command.argv.size()).exists(arg, arg in ["/", "/usr", "/bin", "/sbin", "/opt"])
    )
  )
tags: [privilege_discovery]
