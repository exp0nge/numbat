id: source.git_config_exec
version: "1.4"
enabled: true
title: Git external-program setting requested
description: |-
  The agent requested a persistent git config or per-command -c setting that can
  invoke an external program: an SSH command, diff driver, content filter,
  filesystem monitor, shell alias, or shell-form credential helper. The exact
  bare `!gh auth git-credential` helper form is excluded.
severity: medium
expr: |-
  (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
  shell_commands.exists(command,
    command.name.matches("(?i)^git(\\.exe)?$") &&
    (
      lists.range(command.argv.size()).exists(config,
        config > 0 &&
        command.argv[config].matches("(?i)^config$") &&
        lists.range(config).all(i,
          i == 0 ||
          command.argv[i].startsWith("-") ||
          (
            i > 1 &&
            command.argv[i - 1].matches("(?i)^(-C|--git-dir|--work-tree|--namespace|-c)$")
          )
        ) &&
        lists.range(command.argv.size()).exists(key,
          key > config &&
          lists.range(key).all(i,
            i <= config ||
            command.argv[i].matches("(?i)^(set|--global|--system|--local|--worktree|--add|--append|--replace-all|--fixed-value|--includes|--no-includes|--all|--null|-z)$") ||
            command.argv[i].matches("(?i)^(--type|-t|--value)=.+$") ||
            (
              i > config + 1 &&
              command.argv[i - 1].matches("(?i)^(--type|-t|--value)$")
            )
          ) &&
          (
            command.argv[key].matches("(?i)^(core\\.sshcommand|diff\\.external|filter\\.[a-z0-9_.-]+\\.(clean|smudge|process))=.+$") ||
            command.argv[key].matches("(?i)^alias\\.[a-z0-9_.-]+=\\s*!.+$") ||
            (
              command.argv[key].matches("(?i)^credential\\.helper=\\s*!.+$") &&
              !command.argv[key].matches("(?i)^credential\\.helper=\\s*!\\s*gh\\s+auth\\s+git-credential\\s*$")
            ) ||
            command.argv[key].matches("(?i)^core\\.fsmonitor=(~|\\$|/|\\./|\\.\\./|[A-Za-z]:[/\\\\]).*$") ||
            (
              key + 1 < command.argv.size() &&
              (
                command.argv[key].matches("(?i)^(core\\.sshcommand|diff\\.external|filter\\.[a-z0-9_.-]+\\.(clean|smudge|process))$") &&
                command.argv[key + 1] != "" ||
                command.argv[key].matches("(?i)^alias\\.[a-z0-9_.-]+$") &&
                command.argv[key + 1].matches("^\\s*!.+$") ||
                (
                  command.argv[key].matches("(?i)^credential\\.helper$") &&
                  command.argv[key + 1].matches("^\\s*!.+$") &&
                  !command.argv[key + 1].matches("(?i)^\\s*!\\s*gh\\s+auth\\s+git-credential\\s*$")
                ) ||
                command.argv[key].matches("(?i)^core\\.fsmonitor$") &&
                command.argv[key + 1].matches("^(~|\\$|/|\\./|\\.\\./|[A-Za-z]:[/\\\\]).*$")
              )
            )
          )
        )
      ) ||
      lists.range(command.argv.size()).exists(i,
        i > 0 &&
        lists.range(i).all(j,
          j == 0 ||
          command.argv[j].startsWith("-") ||
          (
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-C|--git-dir|--work-tree|--namespace|-c)$")
          )
        ) &&
        (
          command.argv[i].matches("(?i)^--config-env=(core\\.sshcommand|diff\\.external|filter\\.[a-z0-9_.-]+\\.(clean|smudge|process))=[A-Za-z_][A-Za-z0-9_]*$") ||
          (
            command.argv[i] == "-c" &&
            i + 1 < command.argv.size() &&
            (
              command.argv[i + 1].matches("(?i)^(core\\.sshcommand|diff\\.external|filter\\.[a-z0-9_.-]+\\.(clean|smudge|process))=.+$") ||
              command.argv[i + 1].matches("(?i)^alias\\.[a-z0-9_.-]+=\\s*!.+$") ||
              (
                command.argv[i + 1].matches("(?i)^credential\\.helper=\\s*!.+$") &&
                !command.argv[i + 1].matches("(?i)^credential\\.helper=\\s*!\\s*gh\\s+auth\\s+git-credential\\s*$")
              ) ||
              command.argv[i + 1].matches("(?i)^core\\.fsmonitor=(~|\\$|/|\\./|\\.\\./|[A-Za-z]:[/\\\\]).*$")
            )
          )
        ) &&
        lists.range(command.argv.size()).exists(subcommand,
          subcommand > i + (command.argv[i] == "-c" ? 1 : 0) &&
          !command.argv[subcommand].startsWith("-") &&
          lists.range(subcommand).all(j,
            j == 0 ||
            command.argv[j].startsWith("-") ||
            (
              j > 1 &&
              command.argv[j - 1].matches("(?i)^(-C|--git-dir|--work-tree|--namespace|-c)$")
            )
          )
        )
      )
    )
  )
tags: [git_config_exec]
