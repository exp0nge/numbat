id: exec.reverse_tunnel
version: "1.3"
enabled: true
title: Agent requested a reverse tunnel
description: |-
  The agent requested an SSH RemoteForward or an explicit Chisel/Ligolo reverse tunnel.
  Ordinary SSH, local forwarding (-L), dynamic local SOCKS forwarding (-D), and common
  developer tunnel services are excluded.
severity: high
expr: |-
  (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
  shell_commands.exists(command,
    (
      command.name.matches("(?i)^(ssh|autossh)$") &&
      !command.argv.exists(arg, arg == "-G") &&
      (
        command.argv.exists(arg, arg.matches("^-R(=)?(([^\\s:]+:)+[^\\s:]+|[0-9]{2,5})$")) ||
        lists.range(command.argv.size() - 1).exists(i,
          command.argv[i] == "-R" &&
          command.argv[i + 1].matches("^(([^\\s:]+:)+[^\\s:]+|[0-9]{2,5})$")
        ) ||
        command.argv.exists(arg, arg.matches("(?i)^-oRemoteForward(=|\\s+).+$")) ||
        lists.range(command.argv.size() - 1).exists(i,
          command.argv[i] == "-o" &&
          command.argv[i + 1].matches("(?i)^RemoteForward(=|\\s+).+$")
        )
      )
    ) ||
    (
      command.name.matches("(?i)^chisel$") &&
      command.argv.size() > 2 &&
      command.argv[1] == "client" &&
      command.argv.exists(arg, arg.matches("(?i)^R:(socks|[^\\s]+)$"))
    ) ||
    (
      command.name.matches("(?i)^(ligolo-agent|ligolo-ng-agent)$") &&
      (
        command.argv.exists(arg, arg.matches("(?i)^(-connect|--connect)=\\S+$")) ||
        lists.range(command.argv.size() - 1).exists(i,
          command.argv[i].matches("(?i)^(-connect|--connect)$") &&
          !command.argv[i + 1].startsWith("-")
        )
      )
    )
  )
tags: [attack.t1572]
