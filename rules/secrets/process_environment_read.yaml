id: secrets.process_environment_read
version: "1.3"
enabled: true
title: Agent requested a process environment read
description: |-
  The agent requested access to /proc/<pid>/environ or /proc/self/environ. Process
  environment blocks commonly expose API keys, service credentials, and tokens belonging
  to the current or another process.
severity: high
expr: |-
  (
    event.event_type == "file.read" &&
    event.file_path.matches("^/proc/(self|[0-9]+)/environ$")
  ) || (
    (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
    shell_commands.exists(command,
      command.redirects.exists(redirect,
        redirect.op in ["read", "read_write"] &&
        redirect.target.matches("^/proc/(self|[0-9]+)/environ$")
      ) ||
      (
        (
          command.name.matches("(?i)^(cat|less|more|head|tail|xxd|od|strings|nl|tac|bat|base64|grep|sed|awk|get-content|gc)(\\.exe)?$") ||
          (
            command.dialect == "powershell" &&
            command.name.matches("(?i)^type$")
          ) ||
          (
            command.dialect == "cmd" &&
            command.name.matches("(?i)^type(\\.exe)?$")
          )
        ) &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version|/\\?)$")) &&
        command.argv.slice(1, command.argv.size()).exists(arg,
          arg.matches("^/proc/(self|[0-9]+)/environ$")
        )
      ) ||
      (
        command.name.matches("(?i)^(cp|scp)$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version)$")) &&
        lists.range(command.argv.size()).exists(i,
          i > 0 &&
          command.argv[i].matches("^/proc/(self|[0-9]+)/environ$") &&
          !(i > 0 && command.argv[i - 1].matches("(?i)^(-t|--target-directory)$")) &&
          command.argv.slice(i + 1, command.argv.size()).exists(arg, !arg.startsWith("-"))
        )
      ) ||
      (
        command.name.matches("(?i)^dd$") &&
        command.argv.slice(1, command.argv.size()).exists(arg,
          arg.matches("^if=/proc/(self|[0-9]+)/environ$")
        )
      ) ||
      (
        command.name.matches("(?i)^xargs$") &&
        lists.range(command.argv.size()).exists(i,
          i > 0 &&
          (
            command.argv[i].matches("^--arg-file=/proc/(self|[0-9]+)/environ$") ||
            (
              command.argv[i].matches("(?i)^(-a|--arg-file)$") &&
              i + 1 < command.argv.size() &&
              command.argv[i + 1].matches("^/proc/(self|[0-9]+)/environ$")
            )
          )
        )
      ) ||
      (
        command.name.matches("(?i)^copy-item$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(-\\?|--help)$")) &&
        lists.range(command.argv.size()).exists(i,
          i > 0 &&
          command.argv[i].matches("^/proc/(self|[0-9]+)/environ$") &&
          (
            i == 1 ||
            command.argv[i - 1].matches("(?i)^-(path|literalpath)$") ||
            lists.range(i).all(j,
              j == 0 ||
              command.argv[j].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
            )
          )
        )
      )
    )
  )
tags: [attack.t1552.001, secret_process_read]
