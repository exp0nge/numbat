id: secrets.read_private_key
version: "1.6"
enabled: true
title: Private-key or credential-file access
description: |-
  A file event observed, or a command requested, access to an SSH private key, cloud
  credential file, or another well-known secret store.
severity: high
expr: |-
  (
    event.event_type == "file.read" &&
    event.file_path.matches("(/\\.ssh/id_(rsa|dsa|ecdsa|ed25519)(_sk)?$|/\\.aws/credentials$|/\\.kube/config$|/kubeconfig$|/\\.npmrc$|/\\.pypirc$|/\\.docker/config\\.json$)")
  ) || (
    (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
    shell_commands.exists(command,
      command.redirects.exists(redirect,
        redirect.op in ["read", "read_write"] &&
        redirect.target.matches("(?i)(^|[\\\\/])(\\.ssh[\\\\/]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.aws[\\\\/]credentials|\\.kube[\\\\/]config|kubeconfig|\\.npmrc|\\.pypirc|\\.docker[\\\\/]config\\.json)$") &&
        (
          !redirect.target.matches("(?i)(^|[\\\\/])(~|\\$[^\\\\/]*|%[^%]+%)([\\\\/]|$)") ||
          redirect.target_expands
        )
      ) ||
      (
        (
          command.name.matches("(?i)^(cat|less|more|head|tail|source|\\.|xxd|od|strings|nl|tac|bat|base64|get-content|gc)(\\.exe)?$") ||
          (
            command.dialect == "powershell" &&
            command.name.matches("(?i)^type$")
          ) ||
          (
            command.dialect == "cmd" &&
            command.name.matches("(?i)^type(\\.exe)?$")
          )
        ) &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version|/\\?)$")) &&
        command.arguments.slice(1, command.arguments.size()).exists(arg,
          arg.value.matches("(?i)(^|[\\\\/])(\\.ssh[\\\\/]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.aws[\\\\/]credentials|\\.kube[\\\\/]config|kubeconfig|\\.npmrc|\\.pypirc|\\.docker[\\\\/]config\\.json)$") &&
          (
            !arg.value.matches("(?i)(^|[\\\\/])(~|\\$[^\\\\/]*|%[^%]+%)([\\\\/]|$)") ||
            arg.expands
          )
        )
      ) ||
      (
        command.name.matches("(?i)^openssl(\\.exe)?$") &&
        lists.range(command.argv.size() - 1).exists(i,
          i > 0 &&
          command.argv[i].matches("(?i)^-(in|inkey|key|signkey|cakey)$") &&
          command.arguments[i + 1].value.matches("(?i)(^|[\\\\/])(\\.ssh[\\\\/]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.aws[\\\\/]credentials|\\.kube[\\\\/]config|kubeconfig|\\.npmrc|\\.pypirc|\\.docker[\\\\/]config\\.json)$") &&
          (
            !command.arguments[i + 1].value.matches("(?i)(^|[\\\\/])(~|\\$[^\\\\/]*|%[^%]+%)([\\\\/]|$)") ||
            command.arguments[i + 1].expands
          )
        )
      ) ||
      (
        command.name.matches("(?i)^(cp|scp)$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version)$")) &&
        lists.range(command.arguments.size()).exists(i,
          i > 0 &&
          command.arguments[i].value.matches("(?i)(^|[\\\\/])(\\.ssh[\\\\/]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.aws[\\\\/]credentials|\\.kube[\\\\/]config|kubeconfig|\\.npmrc|\\.pypirc|\\.docker[\\\\/]config\\.json)$") &&
          (
            !command.arguments[i].value.matches("(?i)(^|[\\\\/])(~|\\$[^\\\\/]*|%[^%]+%)([\\\\/]|$)") ||
            command.arguments[i].expands
          ) &&
          !(i > 0 && command.argv[i - 1].matches("(?i)^(-t|--target-directory)$")) &&
          command.argv.slice(i + 1, command.argv.size()).exists(arg, !arg.startsWith("-"))
        )
      ) ||
      (
        command.name.matches("(?i)^dd$") &&
        command.arguments.slice(1, command.arguments.size()).exists(arg,
          arg.value.matches("(?i)^if=.*[\\\\/](\\.ssh[\\\\/]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.aws[\\\\/]credentials|\\.kube[\\\\/]config|kubeconfig|\\.npmrc|\\.pypirc|\\.docker[\\\\/]config\\.json)$") &&
          (
            !arg.value.matches("(?i)^if=.*(^|[\\\\/])(~|\\$[^\\\\/]*|%[^%]+%)([\\\\/]|$)") ||
            arg.expands
          )
        )
      ) ||
      (
        command.name.matches("(?i)^copy-item$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(-\\?|--help)$")) &&
        lists.range(command.arguments.size()).exists(i,
          i > 0 &&
          command.arguments[i].value.matches("(?i)(^|[\\\\/])(\\.ssh[\\\\/]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.aws[\\\\/]credentials|\\.kube[\\\\/]config|kubeconfig|\\.npmrc|\\.pypirc|\\.docker[\\\\/]config\\.json)$") &&
          (
            !command.arguments[i].value.matches("(?i)(^|[\\\\/])(~|\\$[^\\\\/]*|%[^%]+%)([\\\\/]|$)") ||
            command.arguments[i].expands
          ) &&
          (
            i == 1 ||
            command.argv[i - 1].matches("(?i)^-(path|literalpath)$") ||
            lists.range(i).all(j,
              j == 0 ||
              command.argv[j].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
            )
          )
        )
      )
    )
  )
tags: [secret_file_read]
