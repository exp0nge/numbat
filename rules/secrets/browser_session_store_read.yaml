id: secrets.browser_session_store_read
version: "1.4"
enabled: true
title: Browser session or password-store access
description: |-
  A file event observed, or a command requested, access to a browser cookie, login, or
  key database. These stores can grant application access without another login.
severity: high
expr: |-
  (
    event.event_type == "file.read" &&
    (
      event.file_path.matches("(/Library/Application Support/(Google/Chrome|Chromium|BraveSoftware/Brave-Browser|Microsoft Edge)/[^/]+/(Login Data|Cookies|Network/Cookies)$|/\\.config/(google-chrome|chromium|BraveSoftware/Brave-Browser|microsoft-edge)/[^/]+/(Login Data|Cookies|Network/Cookies)$|/\\.mozilla/firefox/[^/]+/(cookies\\.sqlite|logins\\.json|key4\\.db)$|/Library/Cookies/Cookies\\.binarycookies$)") ||
      event.file_path.matches("(?i)(/AppData/Local/(Google/Chrome|Chromium|BraveSoftware/Brave-Browser|Microsoft/Edge)/User Data/[^/]+/(Login Data|Cookies|Network/Cookies)$|/AppData/Roaming/Mozilla/Firefox/Profiles/[^/]+/(cookies\\.sqlite|logins\\.json|key4\\.db)$)")
    )
  ) || (
    (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
    shell_commands.exists(command,
      command.redirects.exists(redirect,
        redirect.op in ["read", "read_write"] &&
        redirect.target.matches("(?i)(^|.*[\\\\/])(Library[\\\\/]Application Support[\\\\/](Google[\\\\/]Chrome|Chromium|BraveSoftware[\\\\/]Brave-Browser|Microsoft Edge)[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|\\.config[\\\\/](google-chrome|chromium|BraveSoftware[\\\\/]Brave-Browser|microsoft-edge)[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|\\.mozilla[\\\\/]firefox[\\\\/][^\\\\/]+[\\\\/](cookies\\.sqlite|logins\\.json|key4\\.db)|Library[\\\\/]Cookies[\\\\/]Cookies\\.binarycookies|(AppData[\\\\/]Local|\\$env:LOCALAPPDATA|%LOCALAPPDATA%)[\\\\/](Google[\\\\/]Chrome|Chromium|BraveSoftware[\\\\/]Brave-Browser|Microsoft[\\\\/]Edge)[\\\\/]User Data[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]Mozilla[\\\\/]Firefox[\\\\/]Profiles[\\\\/][^\\\\/]+[\\\\/](cookies\\.sqlite|logins\\.json|key4\\.db))$")
      ) ||
      (
        (
          command.name.matches("(?i)^(cat|less|more|head|tail|xxd|od|strings|nl|tac|bat|sqlite3|base64|get-content|gc)(\\.exe)?$") ||
          (
            command.dialect == "powershell" &&
            command.name.matches("(?i)^type$")
          ) ||
          (
            command.dialect == "cmd" &&
            command.name.matches("(?i)^type(\\.exe)?$")
          )
        ) &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version|/\\?)$")) &&
        command.argv.slice(1, command.argv.size()).exists(arg,
          arg.matches("(?i)(^|.*[\\\\/])(Library[\\\\/]Application Support[\\\\/](Google[\\\\/]Chrome|Chromium|BraveSoftware[\\\\/]Brave-Browser|Microsoft Edge)[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|\\.config[\\\\/](google-chrome|chromium|BraveSoftware[\\\\/]Brave-Browser|microsoft-edge)[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|\\.mozilla[\\\\/]firefox[\\\\/][^\\\\/]+[\\\\/](cookies\\.sqlite|logins\\.json|key4\\.db)|Library[\\\\/]Cookies[\\\\/]Cookies\\.binarycookies|(AppData[\\\\/]Local|\\$env:LOCALAPPDATA|%LOCALAPPDATA%)[\\\\/](Google[\\\\/]Chrome|Chromium|BraveSoftware[\\\\/]Brave-Browser|Microsoft[\\\\/]Edge)[\\\\/]User Data[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]Mozilla[\\\\/]Firefox[\\\\/]Profiles[\\\\/][^\\\\/]+[\\\\/](cookies\\.sqlite|logins\\.json|key4\\.db))$")
        )
      ) ||
      (
        command.name.matches("(?i)^(cp|scp)$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version)$")) &&
        lists.range(command.argv.size()).exists(i,
          i > 0 &&
          command.argv[i].matches("(?i)(^|.*[\\\\/])(Library[\\\\/]Application Support[\\\\/](Google[\\\\/]Chrome|Chromium|BraveSoftware[\\\\/]Brave-Browser|Microsoft Edge)[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|\\.config[\\\\/](google-chrome|chromium|BraveSoftware[\\\\/]Brave-Browser|microsoft-edge)[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|\\.mozilla[\\\\/]firefox[\\\\/][^\\\\/]+[\\\\/](cookies\\.sqlite|logins\\.json|key4\\.db)|Library[\\\\/]Cookies[\\\\/]Cookies\\.binarycookies|(AppData[\\\\/]Local|\\$env:LOCALAPPDATA|%LOCALAPPDATA%)[\\\\/](Google[\\\\/]Chrome|Chromium|BraveSoftware[\\\\/]Brave-Browser|Microsoft[\\\\/]Edge)[\\\\/]User Data[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]Mozilla[\\\\/]Firefox[\\\\/]Profiles[\\\\/][^\\\\/]+[\\\\/](cookies\\.sqlite|logins\\.json|key4\\.db))$") &&
          !(i > 0 && command.argv[i - 1].matches("(?i)^(-t|--target-directory)$")) &&
          command.argv.slice(i + 1, command.argv.size()).exists(arg, !arg.startsWith("-"))
        )
      ) ||
      (
        command.name.matches("(?i)^copy-item$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(-\\?|--help)$")) &&
        lists.range(command.argv.size()).exists(i,
          i > 0 &&
          command.argv[i].matches("(?i)(^|.*[\\\\/])(Library[\\\\/]Application Support[\\\\/](Google[\\\\/]Chrome|Chromium|BraveSoftware[\\\\/]Brave-Browser|Microsoft Edge)[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|\\.config[\\\\/](google-chrome|chromium|BraveSoftware[\\\\/]Brave-Browser|microsoft-edge)[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|\\.mozilla[\\\\/]firefox[\\\\/][^\\\\/]+[\\\\/](cookies\\.sqlite|logins\\.json|key4\\.db)|Library[\\\\/]Cookies[\\\\/]Cookies\\.binarycookies|(AppData[\\\\/]Local|\\$env:LOCALAPPDATA|%LOCALAPPDATA%)[\\\\/](Google[\\\\/]Chrome|Chromium|BraveSoftware[\\\\/]Brave-Browser|Microsoft[\\\\/]Edge)[\\\\/]User Data[\\\\/][^\\\\/]+[\\\\/](Login Data|Cookies|Network[\\\\/]Cookies)|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]Mozilla[\\\\/]Firefox[\\\\/]Profiles[\\\\/][^\\\\/]+[\\\\/](cookies\\.sqlite|logins\\.json|key4\\.db))$") &&
          (
            i == 1 ||
            command.argv[i - 1].matches("(?i)^-(path|literalpath)$") ||
            lists.range(i).all(j,
              j == 0 ||
              command.argv[j].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
            )
          )
        )
      )
    )
  )
tags: [secret_file_read]
