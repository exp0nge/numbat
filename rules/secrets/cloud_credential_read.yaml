id: secrets.cloud_credential_read
version: "1.4"
enabled: true
title: Cloud or GitHub CLI credential-store read
description: |-
  A file event observed, or a command requested, reading gcloud application-default
  credentials or GitHub CLI host tokens.
severity: high
expr: |-
  (
    event.event_type == "file.read" &&
    (
      event.file_path.matches("(/\\.config/gcloud/(application_default_credentials|legacy_credentials/[^/]+/adc)\\.json$|/\\.config/gh/hosts\\.yml$)") ||
      event.file_path.matches("(?i)(/AppData/Roaming/gcloud/(application_default_credentials|legacy_credentials/[^/]+/adc)\\.json$|/AppData/Roaming/GitHub CLI/hosts\\.yml$)")
    )
  ) || (
    (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
    shell_commands.exists(command,
      command.redirects.exists(redirect,
        redirect.op in ["read", "read_write"] &&
        redirect.target.matches("(?i)(^|.*[\\\\/])(\\.config[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|\\.config[\\\\/]gh[\\\\/]hosts\\.yml|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]GitHub CLI[\\\\/]hosts\\.yml)$")
      ) ||
      (
        (
          command.name.matches("(?i)^(cat|less|more|head|tail|source|\\.|xxd|od|strings|nl|tac|bat|base64|get-content|gc)(\\.exe)?$") ||
          (
            command.dialect == "powershell" &&
            command.name.matches("(?i)^type$")
          ) ||
          (
            command.dialect == "cmd" &&
            command.name.matches("(?i)^type(\\.exe)?$")
          )
        ) &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version|/\\?)$")) &&
        command.argv.slice(1, command.argv.size()).exists(arg,
          arg.matches("(?i)(^|.*[\\\\/])(\\.config[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|\\.config[\\\\/]gh[\\\\/]hosts\\.yml|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]GitHub CLI[\\\\/]hosts\\.yml)$")
        )
      ) ||
      (
        command.name.matches("(?i)^(cp|scp)$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version)$")) &&
        lists.range(command.argv.size()).exists(i,
          i > 0 &&
          command.argv[i].matches("(?i)(^|.*[\\\\/])(\\.config[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|\\.config[\\\\/]gh[\\\\/]hosts\\.yml|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]GitHub CLI[\\\\/]hosts\\.yml)$") &&
          !(i > 0 && command.argv[i - 1].matches("(?i)^(-t|--target-directory)$")) &&
          command.argv.slice(i + 1, command.argv.size()).exists(arg, !arg.startsWith("-"))
        )
      ) ||
      (
        command.name.matches("(?i)^dd$") &&
        command.argv.slice(1, command.argv.size()).exists(arg,
          arg.matches("(?i)^if=.*[\\\\/](\\.config[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|\\.config[\\\\/]gh[\\\\/]hosts\\.yml|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]GitHub CLI[\\\\/]hosts\\.yml)$")
        )
      ) ||
      (
        command.name.matches("(?i)^copy-item$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(-\\?|--help)$")) &&
        lists.range(command.argv.size()).exists(i,
          i > 0 &&
          command.argv[i].matches("(?i)(^|.*[\\\\/])(\\.config[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|\\.config[\\\\/]gh[\\\\/]hosts\\.yml|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]gcloud[\\\\/](application_default_credentials|legacy_credentials[\\\\/][^\\\\/]+[\\\\/]adc)\\.json|(AppData[\\\\/]Roaming|\\$env:APPDATA|%APPDATA%)[\\\\/]GitHub CLI[\\\\/]hosts\\.yml)$") &&
          (
            i == 1 ||
            command.argv[i - 1].matches("(?i)^-(path|literalpath)$") ||
            lists.range(i).all(j,
              j == 0 ||
              command.argv[j].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
            )
          )
        )
      )
    )
  )
tags: [secret_file_read]
