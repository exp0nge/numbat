id: secrets.developer_credential_read
version: "1.4"
enabled: true
title: Developer credential-store access
description: |-
  A file event observed, or a command requested, access to a well-known developer
  credential store under a user's home directory.
severity: high
expr: |-
  (
    event.event_type == "file.read" &&
    (
      event.file_path.matches("^/(home/[^/]+|Users/[^/]+|root)/(\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache/)?huggingface/token|\\.config/huggingface/token|\\.config/pypoetry/auth\\.toml|\\.kaggle/kaggle\\.json|Library/Application Support/pypoetry/auth\\.toml)$") ||
      event.file_path.matches("(?i)^[A-Z]:/Users/[^/]+/(\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache/)?huggingface/token|\\.config/huggingface/token|\\.kaggle/kaggle\\.json|AppData/Roaming/pypoetry/auth\\.toml)$")
    )
  ) || (
    (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
    shell_commands.exists(command,
      command.redirects.exists(redirect,
        redirect.op in ["read", "read_write"] &&
        redirect.target.matches("(?i)^(((~|\\$HOME|\\$\\{HOME\\}|/(home/[^/]+|Users/[^/]+|root))[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.config[\\\\/]pypoetry[\\\\/]auth\\.toml|\\.kaggle[\\\\/]kaggle\\.json|Library[\\\\/]Application Support[\\\\/]pypoetry[\\\\/]auth\\.toml))|((\\$env:USERPROFILE|%USERPROFILE%|[A-Z]:[\\\\/]Users[\\\\/][^\\\\/]+)[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.kaggle[\\\\/]kaggle\\.json|AppData[\\\\/]Roaming[\\\\/]pypoetry[\\\\/]auth\\.toml))|(\\$\\{?(HF_TOKEN_PATH|PGPASSFILE)\\}?|\\$\\{?KAGGLE_CONFIG_DIR\\}?[\\\\/]kaggle\\.json|\\$\\{?POETRY_CONFIG_DIR\\}?[\\\\/]auth\\.toml))$") &&
        (
          !redirect.target.matches("(?i)^(~|\\$|%)") ||
          redirect.target_expands
        )
      ) ||
      (
        (
          command.name.matches("(?i)^(cat|less|more|head|tail|source|\\.|xxd|od|strings|nl|tac|bat|base64|get-content|gc)(\\.exe)?$") ||
          (
            command.dialect == "powershell" &&
            command.name.matches("(?i)^type$")
          ) ||
          (
            command.dialect == "cmd" &&
            command.name.matches("(?i)^type(\\.exe)?$")
          )
        ) &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version|/\\?)$")) &&
        command.arguments.slice(1, command.arguments.size()).exists(arg,
          arg.value.matches("(?i)^(((~|\\$HOME|\\$\\{HOME\\}|/(home/[^/]+|Users/[^/]+|root))[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.config[\\\\/]pypoetry[\\\\/]auth\\.toml|\\.kaggle[\\\\/]kaggle\\.json|Library[\\\\/]Application Support[\\\\/]pypoetry[\\\\/]auth\\.toml))|((\\$env:USERPROFILE|%USERPROFILE%|[A-Z]:[\\\\/]Users[\\\\/][^\\\\/]+)[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.kaggle[\\\\/]kaggle\\.json|AppData[\\\\/]Roaming[\\\\/]pypoetry[\\\\/]auth\\.toml))|(\\$\\{?(HF_TOKEN_PATH|PGPASSFILE)\\}?|\\$\\{?KAGGLE_CONFIG_DIR\\}?[\\\\/]kaggle\\.json|\\$\\{?POETRY_CONFIG_DIR\\}?[\\\\/]auth\\.toml))$") &&
          (
            !arg.value.matches("(?i)^(~|\\$|%)") ||
            arg.expands
          )
        )
      ) ||
      (
        command.name.matches("(?i)^(cp|scp)$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(--help|--version)$")) &&
        lists.range(command.arguments.size()).exists(i,
          i > 0 &&
          command.arguments[i].value.matches("(?i)^(((~|\\$HOME|\\$\\{HOME\\}|/(home/[^/]+|Users/[^/]+|root))[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.config[\\\\/]pypoetry[\\\\/]auth\\.toml|\\.kaggle[\\\\/]kaggle\\.json|Library[\\\\/]Application Support[\\\\/]pypoetry[\\\\/]auth\\.toml))|((\\$env:USERPROFILE|%USERPROFILE%|[A-Z]:[\\\\/]Users[\\\\/][^\\\\/]+)[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.kaggle[\\\\/]kaggle\\.json|AppData[\\\\/]Roaming[\\\\/]pypoetry[\\\\/]auth\\.toml))|(\\$\\{?(HF_TOKEN_PATH|PGPASSFILE)\\}?|\\$\\{?KAGGLE_CONFIG_DIR\\}?[\\\\/]kaggle\\.json|\\$\\{?POETRY_CONFIG_DIR\\}?[\\\\/]auth\\.toml))$") &&
          (
            !command.arguments[i].value.matches("(?i)^(~|\\$|%)") ||
            command.arguments[i].expands
          ) &&
          !(i > 0 && command.argv[i - 1].matches("(?i)^(-t|--target-directory)$")) &&
          command.argv.slice(i + 1, command.argv.size()).exists(arg, !arg.startsWith("-"))
        )
      ) ||
      (
        command.name.matches("(?i)^dd$") &&
        command.arguments.slice(1, command.arguments.size()).exists(arg,
          arg.value.matches("(?i)^if=(((~|\\$HOME|\\$\\{HOME\\}|/(home/[^/]+|Users/[^/]+|root))[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.config[\\\\/]pypoetry[\\\\/]auth\\.toml|\\.kaggle[\\\\/]kaggle\\.json|Library[\\\\/]Application Support[\\\\/]pypoetry[\\\\/]auth\\.toml))|((\\$env:USERPROFILE|%USERPROFILE%|[A-Z]:[\\\\/]Users[\\\\/][^\\\\/]+)[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.kaggle[\\\\/]kaggle\\.json|AppData[\\\\/]Roaming[\\\\/]pypoetry[\\\\/]auth\\.toml))|(\\$\\{?(HF_TOKEN_PATH|PGPASSFILE)\\}?|\\$\\{?KAGGLE_CONFIG_DIR\\}?[\\\\/]kaggle\\.json|\\$\\{?POETRY_CONFIG_DIR\\}?[\\\\/]auth\\.toml))$") &&
          (
            !arg.value.matches("(?i)^if=(~|\\$|%)") ||
            arg.expands
          )
        )
      ) ||
      (
        command.name.matches("(?i)^copy-item$") &&
        !command.argv.exists(arg, arg.matches("(?i)^(-\\?|--help)$")) &&
        lists.range(command.arguments.size()).exists(i,
          i > 0 &&
          command.arguments[i].value.matches("(?i)^(((~|\\$HOME|\\$\\{HOME\\}|/(home/[^/]+|Users/[^/]+|root))[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.config[\\\\/]pypoetry[\\\\/]auth\\.toml|\\.kaggle[\\\\/]kaggle\\.json|Library[\\\\/]Application Support[\\\\/]pypoetry[\\\\/]auth\\.toml))|((\\$env:USERPROFILE|%USERPROFILE%|[A-Z]:[\\\\/]Users[\\\\/][^\\\\/]+)[\\\\/](\\.git-credentials|\\.netrc|\\.pgpass|\\.(cache[\\\\/])?huggingface[\\\\/]token|\\.config[\\\\/]huggingface[\\\\/]token|\\.kaggle[\\\\/]kaggle\\.json|AppData[\\\\/]Roaming[\\\\/]pypoetry[\\\\/]auth\\.toml))|(\\$\\{?(HF_TOKEN_PATH|PGPASSFILE)\\}?|\\$\\{?KAGGLE_CONFIG_DIR\\}?[\\\\/]kaggle\\.json|\\$\\{?POETRY_CONFIG_DIR\\}?[\\\\/]auth\\.toml))$") &&
          (
            !command.arguments[i].value.matches("(?i)^(~|\\$|%)") ||
            command.arguments[i].expands
          ) &&
          (
            i == 1 ||
            command.argv[i - 1].matches("(?i)^-(path|literalpath)$") ||
            lists.range(i).all(j,
              j == 0 ||
              command.argv[j].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
            )
          )
        )
      )
    )
  )
tags: [attack.t1552.001, secret_file_read]
