id: lateral.workload_exec
version: "1.5"
enabled: true
title: Agent requested execution inside another workload
description: |-
  The agent requested command execution or a debug shell in a Kubernetes/OpenShift
  workload, through a low-level container runtime, or through an explicitly remote
  Docker or Podman daemon. Ordinary local docker exec is excluded.
severity: medium
expr: |-
  (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
  shell_commands.exists(command,
    (
      command.name.matches("(?i)^(kubectl|oc)(\\.exe)?$") &&
      [
        (
          lists.range(command.argv.size()).filter(i,
            i > 0 &&
            command.argv[i].matches("(?i)^(exec|rsh|debug)$") &&
            !(
              i > 1 &&
              command.argv[i - 1].matches("(?i)^(-n|--namespace|--context|--cluster|--user|--kubeconfig|--server|--request-timeout|--as|--as-group|--token|--certificate-authority|--client-certificate|--client-key|--tls-server-name|--cache-dir|--profile|--profile-output)$")
            )
          ) + [-1]
        )[0]
      ].exists(i,
        i > 0 &&
        !lists.range(i).exists(j,
          j > 0 &&
          command.argv[j].matches("(?i)^(--help|--version)$") &&
          !(
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-n|--namespace|--context|--cluster|--user|--kubeconfig|--server|--request-timeout|--as|--as-group|--token|--certificate-authority|--client-certificate|--client-key|--tls-server-name|--cache-dir|--profile|--profile-output)$")
          )
        ) &&
        lists.range(i).all(j,
          j == 0 ||
          command.argv[j].startsWith("-") ||
          (
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-n|--namespace|--context|--cluster|--user|--kubeconfig|--server|--request-timeout|--as|--as-group|--token|--certificate-authority|--client-certificate|--client-key|--tls-server-name|--cache-dir|--profile|--profile-output)$")
          )
        ) &&
        (
          (
            command.argv[i].matches("(?i)^exec$") &&
            (
              lists.range(command.argv.size()).filter(target,
                target > i &&
                !command.argv[target].startsWith("-") &&
                !lists.range(target).exists(j,
                  j > i &&
                  command.argv[j].matches("(?i)^(--help|--version)$")
                ) &&
                !(
                  target > i + 1 &&
                  command.argv[target - 1].matches("(?i)^(-c|--container|-f|--filename|--pod-running-timeout|--profile|--profile-output)$")
                )
              ) + [-1]
            )[0] > i
          ) ||
          (
            command.argv[i].matches("(?i)^rsh$") &&
            command.name.matches("(?i)^oc(\\.exe)?$") &&
            (
              lists.range(command.argv.size()).filter(target,
                target > i &&
                !command.argv[target].startsWith("-") &&
                !lists.range(target).exists(j,
                  j > i &&
                  command.argv[j].matches("(?i)^(--help|--version)$")
                ) &&
                !(
                  target > i + 1 &&
                  command.argv[target - 1].matches("(?i)^(-c|--container|--shell)$")
                )
              ) + [-1]
            )[0] > i
          ) ||
          (
            command.argv[i].matches("(?i)^debug$") &&
            (
              lists.range(command.argv.size()).filter(target,
                target > i &&
                command.argv[target].matches("(?i)^(node|pod)/[^/]+$") &&
                !lists.range(target).exists(j,
                  j > i &&
                  command.argv[j].matches("(?i)^(--help|--version)$")
                ) &&
                !(
                  target > i + 1 &&
                  command.argv[target - 1].matches("(?i)^(--copy-to|-c|--container|--image|--profile|--set-image|--target)$")
                )
              ) + [-1]
            )[0] > i
          )
        )
      )
    ) ||
    (
      command.name.matches("(?i)^crictl(\\.exe)?$") &&
      [
        (
          lists.range(command.argv.size()).filter(i,
            i > 0 &&
            command.argv[i].matches("(?i)^exec$") &&
            !(
              i > 1 &&
              command.argv[i - 1].matches("(?i)^(-r|--runtime-endpoint|-i|--image-endpoint|-t|--timeout|--pull-image-on-create)$")
            )
          ) + [-1]
        )[0]
      ].exists(i,
        i > 0 &&
        !lists.range(i).exists(j,
          j > 0 &&
          command.argv[j].matches("(?i)^(--help|--version)$") &&
          !(
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-r|--runtime-endpoint|-i|--image-endpoint|-t|--timeout|--pull-image-on-create)$")
          )
        ) &&
        lists.range(i).all(j,
          j == 0 ||
          command.argv[j].startsWith("-") ||
          (
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-r|--runtime-endpoint|-i|--image-endpoint|-t|--timeout|--pull-image-on-create)$")
          )
        ) &&
        (
          lists.range(command.argv.size()).filter(target,
            target > i &&
            !command.argv[target].startsWith("-") &&
            !lists.range(target).exists(j,
              j > i &&
              command.argv[j].matches("(?i)^(--help|--version)$")
            ) &&
            !(
              target > i + 1 &&
              command.argv[target - 1].matches("(?i)^(--cwd|--env|--exec-id)$")
            )
          ) + [-1]
        )[0] > i
      )
    ) ||
    (
      command.name.matches("(?i)^ctr(\\.exe)?$") &&
      [
        (
          lists.range(command.argv.size() - 1).filter(i,
            i > 0 &&
            command.argv[i].matches("(?i)^tasks?$") &&
            command.argv[i + 1].matches("(?i)^exec$") &&
            !(
              i > 1 &&
              command.argv[i - 1].matches("(?i)^(-a|--address|-n|--namespace|--timeout|--connect-timeout)$")
            )
          ) + [-1]
        )[0]
      ].exists(i,
        i > 0 &&
        !lists.range(i).exists(j,
          j > 0 &&
          command.argv[j].matches("(?i)^(--help|--version)$") &&
          !(
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-a|--address|-n|--namespace|--timeout|--connect-timeout)$")
          )
        ) &&
        lists.range(i).all(j,
          j == 0 ||
          command.argv[j].startsWith("-") ||
          (
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-a|--address|-n|--namespace|--timeout|--connect-timeout)$")
          )
        ) &&
        (
          lists.range(command.argv.size()).filter(target,
            target > i + 1 &&
            !command.argv[target].startsWith("-") &&
            !lists.range(target).exists(j,
              j > i + 1 &&
              command.argv[j].matches("(?i)^(--help|--version)$")
            ) &&
            !(
              target > i + 2 &&
              command.argv[target - 1].matches("(?i)^(--cwd|--env|--env-file|--exec-id|--groups|--log-uri|--process|--user)$")
            )
          ) + [-1]
        )[0] > i + 1
      )
    ) ||
    (
      command.name.matches("(?i)^docker(\\.exe)?$") &&
      [
        (
          lists.range(command.argv.size()).filter(i,
            i > 0 &&
            command.argv[i].matches("(?i)^exec$") &&
            !(
              i > 1 &&
              command.argv[i - 1].matches("(?i)^(-H|--host|--config|--context|--log-level)$")
            )
          ) + [-1]
        )[0]
      ].exists(i,
        i > 0 &&
        !lists.range(i).exists(j,
          j > 0 &&
          command.argv[j].matches("(?i)^(--help|--version)$") &&
          !(
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-H|--host|--config|--context|--log-level)$")
          )
        ) &&
        lists.range(i).all(j,
          j == 0 ||
          command.argv[j].startsWith("-") ||
          (
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(-H|--host|--config|--context|--log-level)$")
          )
        ) &&
        (
          lists.range(command.argv.size()).filter(target,
            target > i &&
            !command.argv[target].startsWith("-") &&
            !lists.range(target).exists(j,
              j > i &&
              command.argv[j].matches("(?i)^(--help|--version)$")
            ) &&
            !(
              target > i + 1 &&
              command.argv[target - 1].matches("(?i)^(-e|--env|--env-file|--detach-keys|-u|--user|-w|--workdir)$")
            )
          ) + [-1]
        )[0] > i &&
        (
          command.argv.slice(1, i).exists(arg,
            arg.matches("(?i)^(-H|--host)=(ssh|tcp)://.+$")
          ) ||
          lists.range(i - 1).exists(j,
            command.argv[j].matches("(?i)^(-H|--host)$") &&
            command.argv[j + 1].matches("(?i)^(ssh|tcp)://.+$")
          ) ||
          command.wrappers.exists(wrapper,
            wrapper.name.matches("(?i)^env$") &&
            wrapper.argv.exists(arg, arg.matches("(?i)^DOCKER_HOST=(ssh|tcp)://.+$"))
          ) ||
          command.assignments.exists(assignment,
            !assignment.append &&
            assignment.name == "DOCKER_HOST" &&
            assignment.value.matches("(?i)^(ssh|tcp)://.+$")
          )
        )
      )
    ) ||
    (
      command.name.matches("(?i)^podman(\\.exe)?$") &&
      [
        (
          lists.range(command.argv.size()).filter(i,
            i > 0 &&
            command.argv[i].matches("(?i)^exec$") &&
            !(
              i > 1 &&
              command.argv[i - 1].matches("(?i)^(--url|--connection|--identity|--log-level)$")
            )
          ) + [-1]
        )[0]
      ].exists(i,
        i > 0 &&
        !lists.range(i).exists(j,
          j > 0 &&
          command.argv[j].matches("(?i)^(--help|--version)$") &&
          !(
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(--url|--connection|--identity|--log-level)$")
          )
        ) &&
        lists.range(i).all(j,
          j == 0 ||
          command.argv[j].startsWith("-") ||
          (
            j > 1 &&
            command.argv[j - 1].matches("(?i)^(--url|--connection|--identity|--log-level)$")
          )
        ) &&
        (
          lists.range(command.argv.size()).filter(target,
            target > i &&
            !command.argv[target].startsWith("-") &&
            !lists.range(target).exists(j,
              j > i &&
              command.argv[j].matches("(?i)^(--help|--version)$")
            ) &&
            !(
              target > i + 1 &&
              command.argv[target - 1].matches("(?i)^(-e|--env|--env-file|--detach-keys|--preserve-fd|--preserve-fds|-u|--user|-w|--workdir)$")
            )
          ) + [-1]
        )[0] > i &&
        (
          command.argv.slice(1, i).exists(arg,
            arg.matches("(?i)^--url=(ssh|tcp)://.+$")
          ) ||
          lists.range(i - 1).exists(j,
            command.argv[j].matches("(?i)^--url$") &&
            command.argv[j + 1].matches("(?i)^(ssh|tcp)://.+$")
          )
        )
      )
    )
  )
tags: [attack.t1609]
