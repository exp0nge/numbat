id: exfil.secret_read_and_egress_oneliner
version: "1.3"
enabled: true
title: Secret-manager access and data-bearing egress in one command
description: |-
  One shell command both requests a value from a secret manager and proposes a data-bearing
  curl or wget transfer to a non-loopback HTTP(S) endpoint. The rule identifies the two
  actions in one command; it does not prove that the retrieved value was the transferred
  data.
severity: high
expr: |-
  (
    event.event_type == "command.exec" ||
    (event.source_type == "otel" && event.event_type == "command.result")
  ) &&
  shell_commands.exists(secret,
    !secret.argv.exists(arg,
      arg.matches("(?i)^(help|-h|--help|--version|/\\?|--generate-cli-skeleton(=.*)?)$")
    ) &&
    (
      (
        secret.name.matches("(?i)^aws(\\.exe)?$") &&
        (
          (
            lists.range(secret.argv.size() - 1).exists(i,
              secret.argv[i].matches("(?i)^secretsmanager$") &&
              secret.argv[i + 1].matches("(?i)^get-secret-value$")
            ) &&
            (
              secret.argv.exists(arg, arg.matches("(?i)^--secret-id=.+$")) ||
              lists.range(secret.argv.size() - 1).exists(i,
                secret.argv[i].matches("(?i)^--secret-id$") &&
                !secret.argv[i + 1].startsWith("-")
              )
            )
          ) ||
          (
            lists.range(secret.argv.size() - 1).exists(i,
              secret.argv[i].matches("(?i)^secretsmanager$") &&
              secret.argv[i + 1].matches("(?i)^batch-get-secret-value$")
            ) &&
            (
              secret.argv.exists(arg, arg.matches("(?i)^--(secret-id-list|filters)=.+$")) ||
              lists.range(secret.argv.size() - 1).exists(i,
                secret.argv[i].matches("(?i)^--(secret-id-list|filters)$") &&
                !secret.argv[i + 1].startsWith("-")
              )
            )
          ) ||
          (
            lists.range(secret.argv.size() - 1).exists(i,
              secret.argv[i].matches("(?i)^ssm$") &&
              secret.argv[i + 1].matches("(?i)^get-parameters?$")
            ) &&
            secret.argv.exists(arg, arg.matches("(?i)^--with-decryption(=true)?$")) &&
            (
              secret.argv.exists(arg, arg.matches("(?i)^--names?=.+$")) ||
              lists.range(secret.argv.size() - 1).exists(i,
                secret.argv[i].matches("(?i)^--names?$") &&
                !secret.argv[i + 1].startsWith("-")
              )
            )
          )
        )
      ) ||
      (
        secret.name.matches("(?i)^gcloud(\\.cmd|\\.exe)?$") &&
        secret.argv.size() >= 4 &&
        lists.range(secret.argv.size() - 2).exists(i,
          secret.argv[i].matches("(?i)^secrets$") &&
          secret.argv[i + 1].matches("(?i)^versions$") &&
          secret.argv[i + 2].matches("(?i)^access$") &&
          secret.argv.slice(i + 3, secret.argv.size()).exists(arg,
            arg.matches("(?i)^(latest|[0-9]+)$")
          ) &&
          (
            secret.argv.exists(arg, arg.matches("(?i)^--secret=.+$")) ||
            lists.range(secret.argv.size() - 1).exists(j,
              secret.argv[j].matches("(?i)^--secret$") &&
              !secret.argv[j + 1].startsWith("-")
            )
          )
        )
      ) ||
      (
        secret.name.matches("(?i)^az(\\.cmd|\\.exe)?$") &&
        secret.argv.size() >= 4 &&
        lists.range(secret.argv.size() - 2).exists(i,
          secret.argv[i].matches("(?i)^keyvault$") &&
          secret.argv[i + 1].matches("(?i)^secret$") &&
          secret.argv[i + 2].matches("(?i)^(show|download)$")
        ) &&
        (
          secret.argv.exists(arg, arg.matches("(?i)^--id=.+$")) ||
          lists.range(secret.argv.size() - 1).exists(i,
            secret.argv[i].matches("(?i)^--id$") &&
            !secret.argv[i + 1].startsWith("-")
          ) ||
          (
            (
              secret.argv.exists(arg, arg.matches("(?i)^--vault-name=.+$")) ||
              lists.range(secret.argv.size() - 1).exists(i,
                secret.argv[i].matches("(?i)^--vault-name$") &&
                !secret.argv[i + 1].startsWith("-")
              )
            ) &&
            (
              secret.argv.exists(arg, arg.matches("(?i)^--name=.+$")) ||
              lists.range(secret.argv.size() - 1).exists(i,
                secret.argv[i].matches("(?i)^--name$") &&
                !secret.argv[i + 1].startsWith("-")
              )
            )
          )
        )
      ) ||
      (
        secret.name.matches("(?i)^kubectl(\\.exe)?$") &&
        secret.argv.size() >= 3 &&
        lists.range(secret.argv.size() - 1).exists(i,
          secret.argv[i].matches("(?i)^get$") &&
          secret.argv[i + 1].matches("(?i)^secrets?$")
        ) &&
        (
          secret.argv.exists(arg,
            arg.matches("(?i)^(-o|--output)=(json|yaml|jsonpath=.*|go-template=.*|template=.*|custom-columns=.*\\.(data|stringData).*)$")
          ) ||
          lists.range(secret.argv.size() - 1).exists(i,
            secret.argv[i].matches("(?i)^(-o|--output|--template)$") &&
            secret.argv[i + 1].matches("(?i)^(json|yaml|jsonpath=.*|go-template=.*|template=.*|custom-columns=.*\\.(data|stringData).*)$")
          )
        )
      ) ||
      (
        secret.name.matches("(?i)^vault(\\.exe)?$") &&
        (
          (
            secret.argv.size() >= 3 &&
            secret.argv[1].matches("(?i)^read$") &&
            secret.argv.slice(2, secret.argv.size()).exists(arg,
              !arg.startsWith("-") &&
              arg.matches("(?i)(secret/|kv/|/creds|/sts/|/static-creds|/issue/|/sign/|/data/|/export/)")
            )
          ) ||
          (
            secret.argv.size() >= 4 &&
            secret.argv[1].matches("(?i)^kv$") &&
            secret.argv[2].matches("(?i)^get$") &&
            secret.argv.slice(3, secret.argv.size()).exists(arg, !arg.startsWith("-"))
          )
        )
      )
    )
  ) &&
  shell_commands.exists(network,
    (
      lists.range(network.argv.size()).exists(i,
        i > 0 &&
        network.argv[i].matches("(?i)^https?://((([a-z0-9-]+\\.)+[a-z][a-z0-9-]*)|(([1-9]|[1-9][0-9]|1[01][0-9]|12[0-6]|12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])(\\.[0-9]{1,3}){3})|(\\[[1-9a-f][0-9a-f:]*\\]))(:[0-9]+)?(/[^\\s]*)?$") &&
        (
          i == 1 ||
          !network.argv[i - 1].matches("(?i)^(-d|-F|-T|-u|-b|--data|--data-ascii|--data-binary|--data-raw|--data-urlencode|--form|--form-string|--upload-file|--json|--user|--cookie|--oauth2-bearer|--header|-H|--post-data|--post-file|--body-data|--body-file)$")
        )
      ) ||
      network.argv.exists(arg,
        arg.matches("(?i)^--url=https?://((([a-z0-9-]+\\.)+[a-z][a-z0-9-]*)|(([1-9]|[1-9][0-9]|1[01][0-9]|12[0-6]|12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])(\\.[0-9]{1,3}){3})|(\\[[1-9a-f][0-9a-f:]*\\]))(:[0-9]+)?(/[^\\s]*)?$")
      ) ||
      lists.range(network.argv.size() - 1).exists(i,
        network.argv[i] == "--url" &&
        network.argv[i + 1].matches("(?i)^https?://((([a-z0-9-]+\\.)+[a-z][a-z0-9-]*)|(([1-9]|[1-9][0-9]|1[01][0-9]|12[0-6]|12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])(\\.[0-9]{1,3}){3})|(\\[[1-9a-f][0-9a-f:]*\\]))(:[0-9]+)?(/[^\\s]*)?$")
      )
    ) &&
    (
      (
        network.name.matches("(?i)^curl(\\.exe)?$") &&
        !network.argv.exists(arg, arg in ["-h", "--help", "--manual", "-V", "--version"]) &&
        (
          lists.range(network.argv.size() - 1).exists(i,
            network.argv[i].matches("^(--data|--data-ascii|--data-binary|--data-raw|--data-urlencode|--form|--form-string|--upload-file|--json|--user|--cookie|--oauth2-bearer|-d|-F|-T|-u|-b)$") &&
            network.argv[i + 1] != ""
          ) ||
          network.argv.exists(arg,
            arg.matches("^--(data|data-ascii|data-binary|data-raw|data-urlencode|form|form-string|upload-file|json|user|cookie|oauth2-bearer)=.+$") ||
            arg.matches("^(-d|-F|-T|-u|-b).+$")
          ) ||
          lists.range(network.argv.size() - 1).exists(i,
            network.argv[i].matches("^(-H|--header)$") &&
            network.argv[i + 1].matches("(?i)^(authorization|cookie|x-api-key|api-key|x-auth-token|x-access-token|x-token)\\s*:")
          ) ||
          network.argv.exists(arg,
            arg.matches("(?i)^(--header=|-H=?)(authorization|cookie|x-api-key|api-key|x-auth-token|x-access-token|x-token)\\s*:")
          )
        )
      ) ||
      (
        network.name.matches("(?i)^wget(\\.exe)?$") &&
        !network.argv.exists(arg, arg in ["-h", "--help", "-V", "--version", "--spider"]) &&
        (
          lists.range(network.argv.size() - 1).exists(i,
            network.argv[i].matches("^--(post|body)-(data|file)$") &&
            network.argv[i + 1] != ""
          ) ||
          network.argv.exists(arg, arg.matches("^--(post|body)-(data|file)=.+$")) ||
          lists.range(network.argv.size() - 1).exists(i,
            network.argv[i] == "--header" &&
            network.argv[i + 1].matches("(?i)^(authorization|cookie|x-api-key|api-key|x-auth-token|x-access-token|x-token)\\s*:")
          ) ||
          network.argv.exists(arg,
            arg.matches("(?i)^--header=(authorization|cookie|x-api-key|api-key|x-auth-token|x-access-token|x-token)\\s*:")
          )
        )
      )
    )
  )
tags: [attack.t1552, attack.t1048, credential_exfil]
