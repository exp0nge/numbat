id: exfil.env_capture_to_network
version: "1.3"
enabled: true
title: Credential material supplied to an outbound upload
description: |-
  One command supplied captured environment output or a known credential file to a
  data-bearing HTTP request. Command substitutions, pipelines, and direct-file upload
  flags must prove data flow, and the endpoint must be in that same command segment.
severity: high
expr: |-
  (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
  shell_commands.exists(network,
    network.name in ["curl", "wget"] &&
    !network.argv.exists(arg, arg in ["-h", "--help", "--manual", "-V", "--version", "--spider"]) &&
    (
      network.argv.exists(arg, arg.matches("(?i)^https?://[^\\s]+$|^--url=https?://[^\\s]+$")) ||
      lists.range(network.argv.size() - 1).exists(i,
        network.argv[i] == "--url" &&
        network.argv[i + 1].matches("(?i)^https?://[^\\s]+$")
      )
    ) &&
    (
      lists.range(network.argv.size() - 1).exists(i,
        (
          (
            network.name == "curl" &&
            network.argv[i].matches("(?i)^(-T|--upload-file)$")
          ) ||
          (
            network.name == "wget" &&
            network.argv[i].matches("(?i)^--post-file$")
          )
        ) &&
        network.argv[i + 1].matches("(?i)^(?:.*[/\\\\])?(\\.env(\\.(local|production|prod|development|dev|staging|test))?|\\.aws[/\\\\]credentials|\\.ssh[/\\\\]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.npmrc|\\.pypirc|\\.docker[/\\\\]config\\.json|\\.kube[/\\\\]config)$")
      ) ||
      network.argv.exists(arg,
        (
          network.name == "curl" &&
          arg.matches("(?i)^(-T=?|--upload-file=)(?:.*[/\\\\])?(\\.env(\\.(local|production|prod|development|dev|staging|test))?|\\.aws[/\\\\]credentials|\\.ssh[/\\\\]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.npmrc|\\.pypirc|\\.docker[/\\\\]config\\.json|\\.kube[/\\\\]config)$")
        ) ||
        (
          network.name == "wget" &&
          arg.matches("(?i)^--post-file=(?:.*[/\\\\])?(\\.env(\\.(local|production|prod|development|dev|staging|test))?|\\.aws[/\\\\]credentials|\\.ssh[/\\\\]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.npmrc|\\.pypirc|\\.docker[/\\\\]config\\.json|\\.kube[/\\\\]config)$")
        )
      ) ||
      lists.range(network.arguments.size()).exists(i,
        (
          (
            i > 0 &&
            network.arguments[i - 1].value.matches("(?i)^(-d|-F|--data|--data-raw|--data-binary|--data-urlencode|--form|--post-data)$")
          ) ||
          network.arguments[i].value.matches("(?i)^(-d|-F|--data|--data-raw|--data-binary|--data-urlencode|--form|--post-data)(=|[^A-Za-z0-9_-]).+$")
        ) &&
        network.arguments[i].subcommands.exists(source_id,
          shell_commands.exists(source,
            source.statement_id == source_id &&
            (
              source.name in ["env", "printenv"] ||
              (
                source.name == "cat" &&
                source.argv.slice(1, source.argv.size()).exists(arg,
                  arg.matches("(?i)^(?:.*[/\\\\])?(\\.env(\\.(local|production|prod|development|dev|staging|test))?|\\.aws[/\\\\]credentials|\\.ssh[/\\\\]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.npmrc|\\.pypirc|\\.docker[/\\\\]config\\.json|\\.kube[/\\\\]config)$")
                )
              )
            )
          )
        )
      ) ||
      (
        network.name == "curl" &&
        network.pipeline_id > 0 &&
        (
          lists.range(network.argv.size() - 1).exists(i,
            (
              network.argv[i].matches("(?i)^(-d|-F|--data|--data-raw|--data-binary|--data-urlencode|--form)$") &&
              network.argv[i + 1].matches("(?i)^([A-Za-z0-9_.-]+=)?@-$")
            ) ||
            (
              network.argv[i].matches("(?i)^(-T|--upload-file)$") &&
              network.argv[i + 1] == "-"
            )
          ) ||
          network.argv.exists(arg,
            arg.matches("(?i)^(-d|-F|--data|--data-raw|--data-binary|--data-urlencode|--form)(=|[A-Za-z0-9_.-]+=)@-$") ||
            arg.matches("(?i)^(-T-|--upload-file=-)$")
          )
        ) &&
        shell_commands.exists(source,
          source.statement_id != network.statement_id &&
          source.pipeline_id == network.pipeline_id &&
          (
            source.name in ["env", "printenv"] ||
            (
              source.name == "cat" &&
              source.argv.slice(1, source.argv.size()).exists(arg,
                arg.matches("(?i)^(?:.*[/\\\\])?(\\.env(\\.(local|production|prod|development|dev|staging|test))?|\\.aws[/\\\\]credentials|\\.ssh[/\\\\]id_(rsa|dsa|ecdsa|ed25519)(_sk)?|\\.npmrc|\\.pypirc|\\.docker[/\\\\]config\\.json|\\.kube[/\\\\]config)$")
              )
            )
          )
        )
      )
    )
  )
tags: [credential_exfil]
